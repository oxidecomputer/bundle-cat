[package]
name = "bundle-cat"
description = "Find and display files in Oxide support bundles"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/oxidecomputer/bundle-cat"
readme = "README.adoc"

[[bin]]
name = "bundle-cat"
path = "src/bin/bundle_cat.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:memmap2"]

[dependencies]
anyhow = "1.0"
# The Unicode-aware methods are unused, and would pull in regex-automata.
bstr = { version = "1.13", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"], optional = true }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
glob = "0.3"
# Times are only ever handled in UTC, so the system time zone and tzdb lookups
# are left out.
jiff = { version = "0.2", default-features = false, features = ["std", "perf-inline", "serde"] }
memmap2 = { version = "0.9", optional = true }
rawzip = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only decoding is needed. Without the default features, the bundled libzstd
# leaves out the legacy formats and dictionary builder, so fewer C sources need
# to build on each platform.
zstd = { version = "0.13", default-features = false }


[dev-dependencies]
insta = { version = "1.48", features = ["yaml", "filters"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
panic = "abort"

# Argument parsing runs once per invocation, so optimize it for size.
[profile.release.package]
clap.opt-level = "s"
clap_builder.opt-level = "s"
clap_lex.opt-level = "s"

# For binaries to distribute. Fat LTO makes the binary smaller and slightly
# faster, but stretches a rebuild after a small edit from about 2 seconds to
# 10, and the missing symbols hamper profiling, so `release` leaves both out.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
