[package]
name = "bundle-cat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bundle-cat"
path = "src/bin/bundle_cat.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:memmap2"]

[dependencies]
anyhow = "1.0"
bstr = "1.13"
clap = { version = "4.6", features = ["derive"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
glob = "0.3"
jiff = { version = "0.2", features = ["serde"] }
memmap2 = { version = "0.9", optional = true }
rawzip = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only decoding is needed. Without the default features, the bundled libzstd
# leaves out the legacy formats and dictionary builder, so fewer C sources need
# to build on each platform.
zstd = { version = "0.13", default-features = false }


[dev-dependencies]
insta = { version = "1.48", features = ["yaml", "filters"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
