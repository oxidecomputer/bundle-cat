[package]
name = "bundle-cat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bundle-cat"
path = "src/bin/bundle_cat.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0"
bstr = "1.12"
clap = { version = "4.6", features = ["derive"], optional = true }
glob = "0.3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.2.0", features = ["jiff-02"] }


[dev-dependencies]
insta = { version = "1.46", features = ["yaml", "filters"] }
tempfile = "3.20"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
