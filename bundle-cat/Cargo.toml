[package]
name = "bundle-cat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bundle-cat-lib = { path = "../bundle-cat-lib" }
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
jiff = "0.2"

[dev-dependencies]
insta = { version = "1.46", features = ["yaml", "filters"] }
serde_json = "1.0"
zip = { version = "8.2.0" }
