[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "1.0.18"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Whether to install an updater program
install-updater = false
# Whether to sign macOS executables
macos-sign = true
ssldotcom-windows-sign = "prod"
# A GitHub repo to push Homebrew formulas to
tap = "oxidecomputer/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]

# The Homebrew formula runs `COMPLETE=<shell> bundle-cat` to generate each
# shell's completions.
[dist.completion-cmds.bundle-cat]
trigger = "clap-env"
shells = ["bash", "fish", "pwsh", "zsh"]

[dist.github-custom-runners.x86_64-unknown-linux-gnu.container]
image = "quay.io/pypa/manylinux_2_28_x86_64"
host = "x86_64-unknown-linux-musl"

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-26"
aarch64-apple-darwin = "macos-26"
